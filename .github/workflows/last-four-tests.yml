name: Last four remediation — ledger and uncertainty tests

on:
  push:
    branches: [rescue/submission-critical-fixes]
    paths:
      - .github/workflows/last-four-tests.yml
      - django_backend/finance/models.py
      - django_backend/finance/migrations/0007_synthetic_double_entry_ledger.py
      - django_backend/finance/services/synthetic_ledger.py
      - django_backend/finance/services/forecast_uncertainty.py
      - django_backend/finance/test_ledger_uncertainty.py
      - django_backend/finance/ledger_api.py
      - django_backend/finance/uncertainty_api.py
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  last-four:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_last4
          POSTGRES_USER: finance_last4
          POSTGRES_PASSWORD: only_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_last4 -d finance_last4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: testing-only-not-prod
      DEBUG: "False"
      DB_NAME: finance_last4
      DB_USER: finance_last4
      DB_PASSWORD: only_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django_backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r django_backend/requirements.txt
      - name: Apply explicit synthetic ledger schema migration
        working-directory: django_backend
        run: python manage.py migrate --noinput
      - name: Run balanced-ledger and rolling uncertainty regression tests
        working-directory: django_backend
        run: python manage.py test finance.test_ledger_uncertainty --noinput
      - name: Validate Django configuration
        working-directory: django_backend
        run: python manage.py check
