name: Gemini verified financial report — one free-tier request

on:
  push:
    branches: [rescue/submission-critical-fixes]
    paths:
      - .github/workflows/gemini-live-report.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_gemini
          POSTGRES_USER: finance_gemini
          POSTGRES_PASSWORD: test_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_gemini -d finance_gemini"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DEBUG: "False"
      DB_NAME: finance_gemini
      DB_USER: finance_gemini
      DB_PASSWORD: test_only_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django_backend/requirements.txt
      - name: Install tested Python dependencies
        run: python -m pip install -r django_backend/requirements.txt
      - name: Migrate synthetic PostgreSQL database
        working-directory: django_backend
        run: python manage.py migrate --noinput
      - name: Generate a fresh small synthetic study to keep free-tier tokens low
        working-directory: django_backend
        run: python manage.py bootstrap_demo_data --seed 42 --transactions 1500 --anomalies 15
      - name: ONE live Gemini report call, numeric claims generated by Python only
        working-directory: django_backend
        run: python manage.py verify_gemini_live --output evidence/gemini_live_status.json
      - name: Upload sanitized status (no key, prompt or response content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live-report-verification
          path: django_backend/evidence/gemini_live_status.json
          if-no-files-found: warn
