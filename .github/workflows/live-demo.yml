name: Live browser demonstration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_browser
          POSTGRES_USER: finance_browser
          POSTGRES_PASSWORD: ephemeral_browser_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_browser -d finance_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: test-runner-only-change-in-production
      DEBUG: "False"
      DB_NAME: finance_browser
      DB_USER: finance_browser
      DB_PASSWORD: ephemeral_browser_db
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DEMO_FRONTEND_URL: "http://127.0.0.1:5173"
      DEMO_EVIDENCE_DIR: "evidence/browser"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django_backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python, browser and frontend
        run: |
          python -m pip install -r django_backend/requirements.txt
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          cd frontend
          npm ci
      - name: Create ephemeral presenter password
        run: |
          password="$(python -c 'import secrets;print(secrets.token_urlsafe(22))')"
          echo "::add-mask::$password"
          echo "DEMO_PRESENTER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Migrate and bootstrap reproducible sample
        working-directory: django_backend
        run: |
          python manage.py migrate --noinput
          python manage.py bootstrap_demo_data --seed 42 --transactions 2000 --anomalies 20
          python manage.py prepare_demo_presenter
          python manage.py check
      - name: Run actual Django and React servers
        run: |
          (cd django_backend && nohup python manage.py runserver 127.0.0.1:8000 --noreload > "$GITHUB_WORKSPACE/django.log" 2>&1 &)
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 > "$GITHUB_WORKSPACE/vite.log" 2>&1 &)
          python - <<'PY'
          import time, urllib.request
          for i in range(90):
              try:
                  urllib.request.urlopen("http://127.0.0.1:5173",timeout=3)
                  print("Vite is serving.")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("Vite did not start.")
          PY
      - name: Execute real browser demonstration
        run: python scripts/browser_demo_smoke.py
      - name: Upload screenshots, timing and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presenter-browser-evidence
          path: |
            evidence/browser/
            django.log
            vite.log
          if-no-files-found: warn
