name: Controlled research evidence — holdout and paired forecasts

on:
  push:
    branches: [rescue/submission-critical-fixes]
    paths:
      - .github/workflows/controlled-research.yml
      - django_backend/finance/services/research_experiments.py
      - django_backend/finance/services/forecast_service.py
      - django_backend/finance/services/fraud_service.py
      - django_backend/finance/test_research_experiments.py
      - django_backend/finance/management/commands/export_research_evidence.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/controlled-research.yml
      - django_backend/finance/services/research_experiments.py
      - django_backend/finance/services/forecast_service.py
      - django_backend/finance/test_research_experiments.py
      - django_backend/finance/management/commands/export_research_evidence.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  controlled-research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_research
          POSTGRES_USER: finance_research
          POSTGRES_PASSWORD: research_test_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_research -d finance_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: research-ci-only-not-production
      DEBUG: "False"
      DB_NAME: finance_research
      DB_USER: finance_research
      DB_PASSWORD: research_test_only_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django_backend/requirements.txt
      - name: Install reproducible backend dependencies
        run: python -m pip install -r django_backend/requirements.txt
      - name: Verify controlled-study invariants and paired evaluation
        working-directory: django_backend
        run: python manage.py test finance.test_research_experiments --noinput
      - name: Run database migrations
        working-directory: django_backend
        run: python manage.py migrate --noinput
      - name: Build original 50,000-row synthetic experiment unchanged
        working-directory: django_backend
        run: python manage.py bootstrap_demo_data --seed 42 --transactions 50000 --anomalies 500
      - name: Export all independent research studies
        working-directory: django_backend
        run: python manage.py export_research_evidence --output evidence/controlled_studies.json --seed 42 --behavioural-transactions 6000 --behavioural-anomalies 90
      - name: Verify chronological split and complete comparison evidence
        run: |
          python - <<'PY'
          import json
          p = 'django_backend/evidence/controlled_studies.json'
          evidence = json.load(open(p))
          a = evidence['original_data_chronological_holdout']
          b = evidence['separate_behavioural_holdout']
          f = evidence['forecast_matched_window_comparison']
          assert a['train_rows'] + a['test_rows'] == 50000
          assert a['training_end'] < a['test_start']
          assert a['test_anomalies'] > 0
          assert b['train_rows'] + b['test_rows'] == 6000
          assert b['test_anomalies'] == 90
          assert len(b['anomaly_type_counts']) == 3
          for study in (a,b):
              cm = study['isolation_forest']['confusion_matrix']
              assert sum(map(sum, cm)) == study['test_rows']
              assert study['confusion_counts']['fn'] + study['confusion_counts']['tp'] == study['test_anomalies']
          for series in ('income', 'expense'):
              val = f[series]['validation']
              assert val['paired_comparison']['observations'] == val['sarima_observations']
              assert len(val['windows']) == val['observations']
          print('Controlled research evidence validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: controlled-research-evidence
          path: django_backend/evidence/controlled_studies.json
          if-no-files-found: error
