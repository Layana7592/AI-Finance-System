name: Submission rescue backend tests

on:
  push:
    branches:
      - rescue/submission-critical-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:

  react-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build React dashboard
        working-directory: frontend
        run: npm run build
      - name: Lint React dashboard
        working-directory: frontend
        run: npm run lint

  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_test -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DEBUG: "False"
      DB_NAME: finance_test
      DB_USER: finance_test
      DB_PASSWORD: test_only_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django_backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q django_backend
      - name: Install dependencies
        run: python -m pip install -r django_backend/requirements.txt
      - name: Django configuration
        working-directory: django_backend
        run: python manage.py check
      - name: Run critical regression tests
        working-directory: django_backend
        run: python manage.py test finance.test_rescue finance.test_workflow_stability --noinput
      - name: Run complete backend suite
        working-directory: django_backend
        run: python manage.py test --noinput
