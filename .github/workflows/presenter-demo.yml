name: Presenter browser demo proof

on:
  push:
    branches: [rescue/submission-critical-fixes]
    paths:
      - .github/workflows/presenter-demo.yml
      - frontend/**
      - django_backend/finance/views.py
      - django_backend/finance/urls.py
      - django_backend/finance/management/commands/prepare_demo_presenter.py
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_presenter
          POSTGRES_USER: finance_presenter
          POSTGRES_PASSWORD: ci_test_database_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_presenter -d finance_presenter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DEBUG: "False"
      DB_NAME: finance_presenter
      DB_USER: finance_presenter
      DB_PASSWORD: ci_test_database_only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEMO_PRESENTER_PASSWORD: "Synthetic-only-strong-ci-password-2026"
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django_backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -r django_backend/requirements.txt
      - name: Migrate clean PostgreSQL database
        working-directory: django_backend
        run: python manage.py migrate --noinput
      - name: Bootstrap real 50,000-transaction synthetic dataset and 12 forecasts
        working-directory: django_backend
        run: python manage.py bootstrap_demo_data --seed 42 --transactions 50000 --anomalies 500
      - name: Create isolated presenter identity and historical transactions
        working-directory: django_backend
        run: python manage.py prepare_demo_presenter
      - name: Run presenter backend integration tests
        working-directory: django_backend
        run: python manage.py test finance.test_presenter_demo --noinput
      - name: Install React application
        working-directory: frontend
        run: npm ci
      - name: Install headless Chromium
        working-directory: frontend
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start genuine Django API and Vite app
        run: |
          (cd django_backend && python manage.py runserver 127.0.0.1:8000 --noreload > ../django-demo.log 2>&1 &)
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 > ../vite-demo.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -sS http://127.0.0.1:8000/api/me/ -o /dev/null; then
              echo "Both services responding"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          tail -100 django-demo.log vite-demo.log || true
          exit 1
      - name: Drive login through all eight real API-backed steps
        working-directory: frontend
        run: node scripts/presenter-e2e.mjs
      - name: Upload genuine browser screenshots, timings, and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presenter-browser-evidence
          path: |
            frontend/evidence/browser/
            django-demo.log
            vite-demo.log
          if-no-files-found: warn
